description: >
  Fiona is an epidemiologist working with the National Institute for Communicable Diseases (NICD) and the Gauteng City-Region Observatory (GCRO) to monitor pathogens in urban communities through wastewater surveillance. She is a PhD candidate at the University of the Witwatersrand, holding an MSc in Epidemiology and Biostatistics and an MSc in Biochemistry. Her current research uses wastewater as an environmental surveillance tool to complement clinical surveillance and to understand how socio-economic factors shape disease patterns. As part of this work, she is helping to model Hepatitis A and measles within a spatial framework, bringing an interdisciplinary approach that applies epidemiological expertise to spatial and analytical methods. Fiona has been closely involved in establishing wastewater surveillance sites in Gauteng, and in the curation, analysis, and spatial modelling of the resulting data, as well as communicating findings across a range of outputs.
