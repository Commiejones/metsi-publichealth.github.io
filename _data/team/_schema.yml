$schema: "http://json-schema.org/draft-07/schema"
title: Team member ID card
description: >
  This is the schema for the team member ID cards contained in the present 
  folder.
type: object
properties:
  name: 
    description: >
      Your name. It is only used for display and thus doesn't have to match your
      administrative name.
    type: string
  affiliation:
    description: >
      select one of the consortium partners
    type: string
  webpage:
    description: A link to your personal webpage (leave blank if you don't have one)
    type: string
    anyOf:
      - const: ""
      - format: uri
  email:
    description: email address
    type: string
  image:
    description: location of local image
    type: string
  github:
    description: Your github username (*without* the '@') allows for blank
    type: string
    pattern: ^([^@]+)?$
  twitter:
    description: Your twitter username (with and without @ both work)
    type: string
  bluesky:
    description: Your BlueSky username (e.g. `sbfnk.bluesky.social`)
    type: string
  orcid:
    description: Your ORCiD
    type: string
    pattern: ^\d{4}-\d{4}-\d{4}-\d{3}(X|\d)$
  description:
    description: A short text about yourself and your work within the team.
    type: string
required:
  - name
  - position
  - affiliation
