description: >
  Comfort Jones is a research master's student at the South African Centre for Epidemiological Modelling and Analysis (SACEMA), Stellenbosch University. She also holds a masters degree in Mathematical Sciences. Her current research work investigates the benefits of adding wastewater surveillance in monitoring hepatitis E. In this grant, she is using wastewater and Quality of Life (QoL) data to investigate the drivers of HEV wastewater levels we see in specific communities in Gauteng. Also, estimating the age- and sex-incidence rates for HEV in Gauteng using serology data.
