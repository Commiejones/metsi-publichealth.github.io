description: >
  Ntsako is a data analyst at the National Institute of Communicable Diseases (NICD). She holds a Masters degree in Epidemiology and Biostatistics from the University of Cape Town, and an Environmental Health (hons) degree from the University of Johannesburg. She provides specialist back-end development and support of the data ecosystem for the Wastewater Genomics Syndicate (WGS) and the Centre for Vaccines and Immunology (CVI)’s communicable disease surveillance programmes.
