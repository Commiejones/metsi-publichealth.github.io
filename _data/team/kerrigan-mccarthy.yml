description: >
  Kerrigan McCarthy is a pathologist at the National Institute for Communicable Diseases in the Centre for Vaccines and Immunology. She has worked in laboratory diagnostics and public health related to communicable disease since the early 2000s. She has worked with a range of pathogens including Cryptococcus neoformans, other opportunistic fungal infections, tuberculosis, HIV, listeriosis and food-borne illness, and vaccine-preventable diseases including measles, rubella, hepatitis and polio. She presently co-leads the Wastewater Genomics Syndicate with Mukhlid Yousif at the NICD's Centre for Vaccines and Immunology'  


